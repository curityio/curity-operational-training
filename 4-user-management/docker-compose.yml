services:

  api-gateway:
    image: kong/kong:latest
    hostname: apigateway
    ports:
      - 443:3000
    volumes:
      - ./kong.yml:/usr/local/kong/declarative/kong.yml
      - ../utils/ssl-certs/example.ssl.key:/usr/local/share/certs/example.ssl.key
      - ../utils/ssl-certs/example.ssl.crt:/usr/local/share/certs/example.ssl.crt
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: '/usr/local/kong/declarative/kong.yml'
      KONG_PROXY_LISTEN: '0.0.0.0:3000 ssl'
      KONG_SSL_CERT: '/usr/local/share/certs/example.ssl.crt'
      KONG_SSL_CERT_KEY: '/usr/local/share/certs/example.ssl.key'

  curity-idsvr:
    image: custom_idsvr:1.0.0
    hostname: idsvr
    env_file:
      - ./config/parameters.env
      - ./vault/protected-secrets.env
    environment:
      ADMIN: 'true'
      LICENSE_KEY: '${LICENSE_KEY}'
    depends_on:
      curity-data:
        condition: service_healthy

  curity-data:
    image: curity_mssql:1.0.0
    hostname: dbserver
    volumes:
    - ./data:/var/opt/mssql/data
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: Password1
      MSSQL_COLLATION: Latin1_General_100_CI_AS_SC_UTF8
      MSSQL_AGENT_ENABLED: true
    entrypoint:
      - /bin/sh
      - -c
      - |
        /tmp/initscripts/initdbserver.sh &
        exec /opt/mssql/bin/sqlservr
    healthcheck:
      test: ["CMD", "/tmp/initscripts/healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  curity-schema-init:
    image: curity.azurecr.io/curity/idsvr:latest
    hostname: dbschemainitializer
    command: ["/opt/idsvr/bin/idsvr", "-I"]
    environment:
      JDBC_URL: 'jdbc:sqlserver://dbserver:1433;databaseName=idsvr;encrypt=false;sendStringParametersAsUnicode=false'
      JDBC_USERNAME: 'sa'
      JDBC_PASSWORD: 'Password1'
    depends_on:
      curity-data:
        condition: service_healthy
